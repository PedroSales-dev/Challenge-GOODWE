  <rect x="40" y="250" width="1100" height="230" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="64" y="278" fill="#34d399" font-size="15" font-weight="700">CAMADA DE APLICAÇÃO</text>
  <text x="64" y="296" fill="#94a3b8" font-size="11.5">Backend, regras de negócio, motor de rateio e módulo analítico de IA</text>

  <rect x="64" y="312" width="248" height="148" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="188" y="334" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">API de Domínio</text>
  <text x="188" y="354" fill="#94a3b8" font-size="11" text-anchor="middle">FastAPI · REST/Webhooks</text>
  <text x="188" y="372" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Sessões · Usuários</text>
  <text x="188" y="388" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Unidades · Veículos</text>
  <text x="188" y="404" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Autenticação RFID/App</text>
  <text x="188" y="436" fill="#64748b" font-size="9.5" text-anchor="middle">PostgreSQL + TimescaleDB</text>

  <rect x="336" y="312" width="248" height="148" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="460" y="334" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Motor de Rateio (RHPS)</text>
  <text x="460" y="354" fill="#94a3b8" font-size="11" text-anchor="middle">Regras de Negócio</text>
  <text x="460" y="372" fill="#cbd5e1" font-size="10.5" text-anchor="middle">kWh por unidade/sessão</text>
  <text x="460" y="388" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Tarifa vigente + perdas</text>
  <text x="460" y="404" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Taxa fixa por fração ideal</text>
  <text x="460" y="436" fill="#64748b" font-size="9.5" text-anchor="middle">Fechamento mensal de fatura</text>

  <rect x="608" y="304" width="264" height="164" rx="10" fill="#1e1b33" stroke="url(#iaGlow)" stroke-width="2"/>
  <text x="740" y="328" fill="#f8fafc" font-size="13.5" font-weight="700" text-anchor="middle">AURA — Módulo Analítico (IA)</text>
  <text x="740" y="347" fill="#a78bfa" font-size="10.5" text-anchor="middle">Assistente para Uso e Rateio Automatizado</text>
  <text x="740" y="368" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Previsão de demanda (séries temporais)</text>
  <text x="740" y="386" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Detecção de anomalias (Isolation Forest)</text>
  <text x="740" y="404" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Sumarização em linguagem natural (NLP)</text>
  <text x="740" y="422" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Sugestão de horários de menor pico</text>
  <text x="740" y="448" fill="#64748b" font-size="9.5" text-anchor="middle">scikit-learn · Prophet · LLM via API</text>

  <rect x="896" y="312" width="204" height="148" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="998" y="334" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Gateway de Integração</text>
  <text x="998" y="354" fill="#94a3b8" font-size="11" text-anchor="middle">Conectores externos</text>
  <text x="998" y="372" fill="#cbd5e1" font-size="10.5" text-anchor="middle">GoodWe SEMS OpenAPI</text>
  <text x="998" y="388" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Open Charge Map API</text>
  <text x="998" y="404" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Google Places (evCharge)</text>

  <line x1="590" y1="490" x2="590" y2="520" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="520" x2="590" y2="490" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CAMADA DE CONECTIVIDADE -->
  <rect x="40" y="530" width="1100" height="120" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="64" y="558" fill="#fbbf24" font-size="15" font-weight="700">CAMADA DE CONECTIVIDADE</text>
  <text x="64" y="576" fill="#94a3b8" font-size="11.5">Transporte de eventos entre o hardware e a aplicação</text>

  <rect x="64" y="588" width="330" height="46" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="229" y="616" fill="#e2e8f0" font-size="13" text-anchor="middle">OCPP 1.6/2.0.1 sobre WebSocket (JSON)</text>

  <rect x="420" y="588" width="330" height="46" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="585" y="616" fill="#e2e8f0" font-size="13" text-anchor="middle">Modbus TCP — leitura de medição (RS-485/LAN)</text>

  <rect x="776" y="588" width="324" height="46" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="938" y="616" fill="#e2e8f0" font-size="13" text-anchor="middle">Rede local / Internet — Wi-Fi, LAN, 4G fallback</text>

  <line x1="590" y1="654" x2="590" y2="684" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="684" x2="590" y2="654" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CAMADA FÍSICA -->
  <rect x="40" y="694" width="1100" height="160" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="64" y="722" fill="#f87171" font-size="15" font-weight="700">CAMADA FÍSICA</text>
  <text x="64" y="740" fill="#94a3b8" font-size="11.5">Hardware instalado no Estacionamento L1 — Energy Innovation Lab</text>

  <rect x="64" y="752" width="248" height="86" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="188" y="774" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">GoodWe HCA G2</text>
  <text x="188" y="792" fill="#cbd5e1" font-size="10.5" text-anchor="middle">AC 7/11/22 kW · Type 2</text>
  <text x="188" y="808" fill="#cbd5e1" font-size="10.5" text-anchor="middle">RS-485(x2) · LAN · Wi-Fi · BLE</text>
  <text x="188" y="824" fill="#cbd5e1" font-size="10.5" text-anchor="middle">IP66 · medição embarcada</text>

  <rect x="336" y="752" width="248" height="86" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="460" y="774" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Autenticação</text>
  <text x="460" y="792" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Cartões RFID por usuário</text>
  <text x="460" y="808" fill="#cbd5e1" font-size="10.5" text-anchor="middle">App SolarGo/SEMS+ (BLE/Wi-Fi)</text>
  <text x="460" y="824" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Autostart por conexão do plugue</text>

  <rect x="608" y="752" width="264" height="86" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="740" y="774" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Proteção e Medição</text>
  <text x="740" y="792" fill="#cbd5e1" font-size="10.5" text-anchor="middle">DR 30mA AC + 6mA DC</text>
  <text x="740" y="808" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Medidor MID opcional (Modbus)</text>
  <text x="740" y="824" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Conformidade NBR 5410/17019/IEC 61851-1</text>

  <rect x="896" y="752" width="204" height="86" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="998" y="774" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Veículo Elétrico</text>
  <text x="998" y="792" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Conector Type 2 (IEC 62196)</text>
  <text x="998" y="808" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Modo de carga 3 (AC)</text>

  <text x="40" y="880" fill="#475569" font-size="11">EV ChargeOps · FIAP + GoodWe · Enterprise Challenge 2026 · Sprint 01</text>
</svg>
