<svg viewBox="0 0 1180 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f1b2e"/>
    </linearGradient>
    <linearGradient id="iaGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0ea5a3"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="900" fill="url(#bg)"/>

  <!-- Título -->
  <text x="40" y="48" fill="#f8fafc" font-size="28" font-weight="700">EV ChargeOps — Arquitetura em Camadas</text>
  <text x="40" y="74" fill="#94a3b8" font-size="14">Sprint 01 · Energy Innovation Lab FIAP/GoodWe — Estacionamento L1, Unidade Aclimação</text>

  <!-- CAMADA DE APRESENTAÇÃO -->
  <rect x="40" y="100" width="1100" height="110" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="64" y="128" fill="#38bdf8" font-size="15" font-weight="700">CAMADA DE APRESENTAÇÃO</text>
  <text x="64" y="146" fill="#94a3b8" font-size="11.5">Interfaces para humanos: gestor (síndico/administradora) e usuário final (condômino/motorista)</text>

  <rect x="64" y="156" width="330" height="42" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="229" y="181" fill="#e2e8f0" font-size="13" text-anchor="middle">Painel do Gestor (Web) — fila, faturas, anomalias</text>

  <rect x="420" y="156" width="330" height="42" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="585" y="181" fill="#e2e8f0" font-size="13" text-anchor="middle">App do Morador (Mobile/PWA) — sessões, saldo, agenda</text>

  <rect x="776" y="156" width="324" height="42" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="938" y="181" fill="#e2e8f0" font-size="13" text-anchor="middle">Boletim Energético Inteligente (relatório mensal em linguagem natural)</text>

  <line x1="590" y1="210" x2="590" y2="240" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="240" x2="590" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

